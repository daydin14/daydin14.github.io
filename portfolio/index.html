<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Personal Portfolio created using React" />
    <meta name="theme-color" content="#f3efe7" />
    <title>daydin14</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var themes = ['light', 'corporate', 'emerald', 'nord', 'dark', 'dim', 'business', 'synthwave'];
        var theme = 'light';
        try {
          var saved = localStorage.getItem('theme');
          if (themes.indexOf(saved) !== -1) theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (error) {
          /* Storage can be blocked; the default theme still applies. */
        }
        document.documentElement.setAttribute('data-theme', theme);

        var params = new URLSearchParams(location.search);
        var redirect = params.get('redirect');
        if (redirect && redirect.charAt(0) === '/' && redirect.charAt(1) !== '/') {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
